[project]
name = "fsp-hiring"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "argon2-cffi>=23.1",
  "numpy>=2.0",
  "quickjs>=1.19.4",
  "openai>=1.50",
  "pypdfium2>=4.30",
  "reportlab>=4.2",
  "natasha>=1.6",
  "python-multipart>=0.0.9",
  "apscheduler>=3.10,<4",
  "pyjwt[crypto]>=2.8",
  "httpx>=0.27",
  "alembic>=1.16",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "pgserver>=0.1.4",
    "ruff>=0.6",
    "hypothesis>=6.112",
    "pandas>=3.0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: медленные тесты с подпроцессами"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # длинные строки текстов и тестов допустимы

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]
