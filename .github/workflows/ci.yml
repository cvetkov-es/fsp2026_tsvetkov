name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }   # версия pnpm — из packageManager
      - uses: actions/setup-node@v5
        with: { node-version: 26, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: node scripts/copy-check.mjs   # тексты интерфейса: docs/ux-writing.md
      - run: pnpm test
      - run: pnpm build
