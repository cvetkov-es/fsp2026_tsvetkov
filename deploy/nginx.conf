server {
  listen 8080;  # nginx-unprivileged: без root нельзя слушать порты < 1024
  root /usr/share/nginx/html;
  # Резюме до RESUME_MAX_MB = 5 МБ; разбор в худшем случае: PDF 10 с + NER 20 с + LLM 2 модели × 2 попытки × 25 с
  location /api/ {
    proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 6m;
    proxy_read_timeout 150s;
  }
  # Встроенные моки внешних систем (FSP ID, API достижений) — тот же процесс API, только в демо-режиме
  location /mock/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location / { try_files $uri /index.html; }
}
